apiVersion: v1
kind: Service
metadata:
  name:
    ? .Values.service.serviceName:
    :
spec:
  type: NodePort
  ports:
    - port:
        ? .Values.service.servicePort:
        :
      targetPort:
        ? .Values.deploy.containerPort:
        :
      nodePort:
        ? .Values.service.nodePort:
        :
  selector:
    components:
      ? .Values.deploy.deployComponents:
      :
